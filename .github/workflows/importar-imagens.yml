# Roda uma única vez: baixa as 3 fotos em resolução total do site no ar,
# guarda em assets/img/src/ e se apaga no mesmo commit.
name: Importar imagens do site
on:
  push:
    branches: [main]
    paths: ['.github/workflows/importar-imagens.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar imagens
        run: |
          set -e
          mkdir -p assets/img/src
          for n in hero-explosao-alimentos criancas-felizes-lancheira bebe-papinha; do
            curl -fsSL --retry 3 -o "assets/img/src/$n.webp" "https://lancheirasepapinhas.com.br/assets/img/$n.webp"
            test "$(stat -c%s "assets/img/src/$n.webp")" -gt 20000
          done
          ls -la assets/img/src
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/importar-imagens.yml
          git add assets/img/src
          git commit -m "Guarda as fotos originais do site em assets/img/src"
          git push
